<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E5C3A"/>
      <stop offset="100%" stop-color="#0F3320"/>
    </linearGradient>
    <linearGradient id="arc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#A04E22"/>
      <stop offset="50%"  stop-color="#E07840"/>
      <stop offset="100%" stop-color="#A04E22"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%"   stop-color="#3D9E72" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0F3320" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="plate" cx="38%" cy="32%" r="65%">
      <stop offset="0%"   stop-color="#FEFCF6"/>
      <stop offset="100%" stop-color="#EDE8DD"/>
    </radialGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <rect width="512" height="512" rx="115" fill="url(#glow)"/>

  <!-- Subtle diagonal texture -->
  <line x1="0"   y1="512" x2="512" y2="0"   stroke="white" stroke-width="0.5" opacity="0.04"/>
  <line x1="80"  y1="512" x2="512" y2="80"  stroke="white" stroke-width="0.5" opacity="0.04"/>
  <line x1="180" y1="512" x2="512" y2="180" stroke="white" stroke-width="0.5" opacity="0.04"/>
  <line x1="0"   y1="340" x2="340" y2="0"   stroke="white" stroke-width="0.5" opacity="0.04"/>
  <line x1="0"   y1="180" x2="180" y2="0"   stroke="white" stroke-width="0.5" opacity="0.04"/>

  <!-- Decorative top arc  terracotta, signals warmth -->
  <path d="M 148 162 Q 256 118 364 162"
        fill="none" stroke="url(#arc)" stroke-width="4.5"
        stroke-linecap="round"/>
  <path d="M 168 176 Q 256 140 344 176"
        fill="none" stroke="#C4622D" stroke-width="1.5"
        stroke-linecap="round" opacity="0.35"/>

  <!-- Plate shadow -->
  <circle cx="258" cy="296" r="152" fill="#000000" opacity="0.20"/>

  <!-- Plate main -->
  <circle cx="256" cy="292" r="150" fill="url(#plate)"/>

  <!-- Plate outer rim -->
  <circle cx="256" cy="292" r="150" fill="none"
          stroke="#C4622D" stroke-width="2.5" opacity="0.25"/>

  <!-- Plate inner rim  fine dining detail -->
  <circle cx="256" cy="292" r="133" fill="none"
          stroke="#C4622D" stroke-width="1" opacity="0.12"/>

  <!-- Fork (left of plate) -->
  <g fill="#1B4332" opacity="0.75">
    <rect x="171" y="306" width="11" height="68" rx="5.5"/>
    <rect x="174" y="280" width="6"  height="30" rx="3"/>
    <rect x="167" y="234" width="5"  height="50" rx="2.5"/>
    <rect x="174" y="234" width="5"  height="50" rx="2.5"/>
    <rect x="181" y="234" width="5"  height="50" rx="2.5"/>
  </g>

  <!-- Knife (right of plate) -->
  <g fill="#1B4332" opacity="0.75">
    <rect x="330" y="306" width="11" height="68" rx="5.5"/>
    <path d="M 332 234 L 342 234 Q 349 258 343 306 L 332 306 Z"/>
  </g>

  <!-- Monogram CA  the hero element -->
  <text
    x="256" y="306"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="98"
    font-weight="400"
    fill="#1B4332"
    text-anchor="middle"
    dominant-baseline="middle"
    letter-spacing="10"
    opacity="0.9"
  >CA</text>

  <!-- Terracotta hairline under monogram -->
  <line x1="200" y1="328" x2="312" y2="328"
        stroke="#C4622D" stroke-width="2" opacity="0.65"
        stroke-linecap="round"/>

  <!-- Three dots brand flourish -->
  <circle cx="236" cy="343" r="3" fill="#C4622D" opacity="0.5"/>
  <circle cx="256" cy="343" r="3" fill="#C4622D" opacity="0.5"/>
  <circle cx="276" cy="343" r="3" fill="#C4622D" opacity="0.5"/>

  <!-- Outer icon border, barely visible -->
  <rect x="3" y="3" width="506" height="506" rx="113"
        fill="none" stroke="white" stroke-width="1.5" opacity="0.07"/>
</svg>
